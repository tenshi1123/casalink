name: casalink
description: "Casalink App"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.2.4+24

environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  flutter_screenutil: ^5.9.3
  url_launcher: ^6.3.0
  otp_pin_field: ^1.4.0
  provider: ^6.1.2
  flutter_bloc: ^8.1.6
  persistent_bottom_nav_bar_v2: ^5.3.1
  smooth_page_indicator: ^1.2.0+3
  table_calendar: ^3.1.3
  flick_video_player: ^0.9.0
  visibility_detector: ^0.4.0+2
  flutter_svg: ^2.0.10+1
  firebase_auth: ^5.4.0
  camera_camera: ^3.0.0
  image_picker: ^1.1.2
  flutter_widget_from_html: ^0.15.3
  firebase_core: ^3.9.0
  shared_preferences: ^2.3.5
  onesignal_flutter: ^5.3.0
  dio: ^5.7.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.2
  webview_flutter_wkwebview: ^3.18.1
  fluttertoast: any
  flutter_file_downloader: ^2.0.0
  flutter_downloader: ^1.12.0
  permission_handler: ^11.3.1
  upgrader: ^11.3.1
  shorebird_code_push: ^2.0.3
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - shorebird.yaml
